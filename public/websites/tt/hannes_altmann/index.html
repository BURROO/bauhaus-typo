<!doctype html>
<html lang="de">
	<head>
		<meta charset="UTF-8" />
		<title>Drop Them Baselines</title>
  		<base href="/websites/tt/hannes_altmann/">

		<link rel="stylesheet" href="style.css" />

		<!-- Paper.js -->
		<script
			type="text/javascript"
			src="https://unpkg.com/paper@0.12.17/dist/paper-full.js"
		></script>
	</head>

	<body>
		<div id="controls">
			<div class="mode-switch">
				<input type="radio" name="mode" id="shapeSquare" />
				<label for="shapeSquare">▢</label>

				<input type="radio" name="mode" id="shapeCircle" checked />
				<label for="shapeCircle">◯</label>

				<input type="radio" name="mode" id="noSelectionMode" />
				<label for="noSelectionMode">►</label>
			</div>

			<div class="controls-label">controls</div>

			<div class="controls-inner">
				<div class="sliders-section">
					<label for="SliderFontSize">Font Size</label>
					<input
						type="range"
						min="10"
						max="200"
						value="15"
						id="SliderFontSize"
					/>
					<label for="SliderForceStrength">Force Strength</label>
					<input
						type="range"
						min="0"
						max="0.3"
						value="0.025"
						step="0.005"
						id="SliderForceStrength"
					/>
					<label for="SliderRadius">Mouse Radius</label>
					<input
						type="range"
						min="10"
						max="200"
						value="120"
						id="SliderRadius"
					/>

					<!-- <label for="SliderLineHeight">Line Height</label>
					<input
						type="range"
						id="SliderLineHeight"
						min="0.8"
						max="2.0"
						step="0.01"
						value="1.25"
					/>

					<label for="SliderTracking">Tracking (em)</label>
					<input
						type="range"
						id="SliderTracking"
						min="-0.2"
						max="1.0"
						step="0.01"
						value="0"
					/> -->
				</div>

				<label>Force Type</label>
				<div class="force-type-grid">
					<span data-force-modes="circle square">
						<input type="radio" id="push" name="force" value="push" checked />
						<label for="push">PUSH</label>
					</span>
					<span data-force-modes="circle">
						<input type="radio" id="pull" name="force" value="pull" />
						<label for="pull">PULL</label>
					</span>
					<span data-force-modes="square">
						<input type="radio" id="split" name="force" value="split" />
						<label for="split">SPLIT</label>
					</span>
					<span data-force-modes="square">
						<input type="radio" id="spiral" name="force" value="spiral" />
						<label for="spiral">SPIRAL</label>
					</span>
					<span data-force-modes="square">
						<input type="radio" id="jitter" name="force" value="jitter" />
						<label for="jitter">JITTER</label>
					</span>
					<span data-force-modes="square">
						<input type="radio" id="bell" name="force" value="bell" />
						<label for="bell">BELL</label>
					</span>
				</div>

				<div class="bottom-Buttons">
					<button id=" Btn">SVG</button>
					<button id="fillTextBtn">Fill</button>
					<button id="renderBtn" style="background: #e74c3c">Clear</button>
				</div>
			</div>
		</div>

		<textarea
			id="overlayTextarea"
			placeholder="They say the British complain about the weather at least three times a day. Personally, I consider that an underestimation bordering on slander. I complain about the weather the way other people hydrate: constantly, instinctively, and with a faint sense of moral duty. It’s one of my most finely honed talents, practically a calling. Too hot. Too cold. Too windy. Not windy enough. The drizzle is rude. The cloud cover is smug. The frost feels judgmental. Some people complain recreationally. I complain as if the climate owes me money. Until last Tuesday, I assumed this was harmless. A personality quirk. A coping mechanism. A British pastime with strong instincts for survival and sarcasm. I only realised the weather had developed a personal vendetta against me the morning my umbrella tried to bite me. To be clear, it wasn’t a mouth or anything. My umbrella, a device whose sole purpose is loyalty in adversity, snapped shut on my fingers like it had been hired to assassinate me. I yelped and dropped it. A gust of wind immediately rolled it away down the pavement, with the vindictive enthusiasm of something that had finally handed in its notice. I glared upward. “Oh, so THAT’S your mood today,” I said. A sunbeam appeared briefly to spotlight the discarded umbrella like a fallen soldier in a crime drama. The sky, in my professional opinion, was smirking. They say the British complain about the weather at least three times a day. Personally, I consider that an underestimation bordering on slander. I complain about the weather the way other people hydrate: constantly, instinctively, and with a faint sense of moral duty. It’s one of my most finely honed talents, practically a calling. Too hot. Too cold. Too windy. Not windy enough. The drizzle is rude. The cloud cover is smug. The frost feels judgmental. Some people complain recreationally. I complain as if the climate owes me money. Until last Tuesday, I assumed this was harmless. A personality quirk. A coping 		></textarea>

		<canvas id="canvas" resize></canvas>

		<div id="hiddenGallery" aria-hidden="true">
			<img id="hiddenGalleryImage" alt="Hidden gallery image" />
		</div>

		<script type="text/javascript" src="js/hiddenGallery.js"></script>
		<script type="text/javascript" src="js/force.js"></script>
		<script type="text/javascript" src="js/text.js"></script>
		<script type="text/javascript" src="js/state.js"></script>
		<script type="text/javascript" src="js/interactions.js"></script>
		<script type="text/javascript" src="js/controls.js"></script>
		<script type="text/javascript" src="js/textEdit.js"></script>
		<script type="text/javascript" src="js/main.js"></script>
	</body>
</html>
