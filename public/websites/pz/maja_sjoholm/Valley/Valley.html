<script>

// wait until HTML document is fully loaded
document.addEventListener('DOMContentLoaded', () => {

  // select all elements with the class draggable
  const draggables = document.querySelectorAll('.draggable');

  // this variable will store the element that is currently being dragged
  let activeEl = null;

  // these variables store the distance between the mouse pointer and the top-left corner of the dragged element
  let startX = 0;
  let startY = 0;

  // these store the element’s new position while dragging
  let currentX = 0;
  let currentY = 0;

  // do this vor every draggable
  draggables.forEach((el) => {

    // listen for a mouse button press on the element
    el.addEventListener('mousedown', e => {

      // prevent some browser’s default image drag behavior, “ghost image” that follows the cursor
      e.preventDefault();

      // mark active element
      activeEl = el;

      // calculate where the mouse is inside element, prevents element from jumping
      startX = e.clientX - el.offsetLeft;
      startY = e.clientY - el.offsetTop;

      // bring the dragged element above all others
      el.style.zIndex = 1000;

      // change the cursor to indicate dragging, we have to do this here instead of css 
      el.style.cursor = 'grabbing';
    });
  });

  // listen for mouse movement anywhere on the page
  document.addEventListener('mousemove', e => {

    // if no element is being dragged, do nothing
    if (!activeEl) return;

    // calculate  new position of the element based on the mouse position minus the initial offset
    currentX = e.clientX - startX;
    currentY = e.clientY - startY;

    // move element by updating its css position
    activeEl.style.left = `${currentX}px`;
    activeEl.style.top  = `${currentY}px`;
  });

  // listen for when the mouse button is released
  document.addEventListener('mouseup', () => {

    // if nothing is being dragged, do nothing
    if (!activeEl) return;

    // restore the cursor appearance
    activeEl.style.cursor = 'grab';

    // reset the z-index so normal stacking resumes
    activeEl.style.zIndex = '';

    // clear the active element this stops the dragging
    activeEl = null;
  });

});
</script>
