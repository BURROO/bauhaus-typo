        <div class="text">

                <li>and 7 different tutorials</li>
                <li>peace &lt;3</li>
        </ul>

    <div class="image-container">
     <div class="hover-zone">
      <img src="images/tip.png" class="img cover">

      <div class="open">
        <img src="images/open.png" class="img">
        <a href="book.html"><img src="images/cat_book.png" class="book-img" title="click me"></a>

      </div>
     </div>
     
    </div>

   <script>
  const ul = document.getElementById("type-list");
  const items = Array.from(ul.querySelectorAll("li"));
  const texts = items.map(li => li.textContent);

  ul.innerHTML = "";

  let liIndex = 0;
  let charIndex = 0;
  let currentLi;
  let cursor = document.createElement("span");
  cursor.className = "cursor";
  cursor.textContent = "|";

  function typeList() {
    if (liIndex < texts.length) {
      if (charIndex === 0) {
        currentLi = document.createElement("li");
        ul.appendChild(currentLi);
        currentLi.appendChild(cursor);
      }

      if (charIndex < texts[liIndex].length) {
        cursor.before(texts[liIndex][charIndex]);
        charIndex++;
        setTimeout(typeList, 80);
      } else {
        cursor.remove();
        charIndex = 0;
        liIndex++;
        setTimeout(typeList, 400);
      }
    }
  }

  typeList();
</script>

    </body>
