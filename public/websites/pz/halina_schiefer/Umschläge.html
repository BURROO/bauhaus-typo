  <!-- Paste the supplied gallery script below (this replaces your previous gallery script) -->
 <script>
document.addEventListener('DOMContentLoaded', () => {
  // central class/group mapping (optional)
  const imageGroups = {
    oma: ['Img/NachrichtOma.png','Img/Thanxx.png','Img/Schmetterlinge1.png'],
    sowichtig: ['Img/Sowichtig.png','Img/Beingloved.png']
  };

  const overlay = document.getElementById('popupOverlay');
  const scrollBox = document.getElementById('popupScroll');
  const closeBtn = document.getElementById('popupClose');
  if (!overlay || !scrollBox || !closeBtn) return;
  scrollBox.tabIndex = -1;

  // ---------- Utility loaders & helpers (deterministic order) ----------
  function tryLoadUrls(candidates, callbackWhenDone) {
    const successSet = new Set();
    let pending = candidates.length;
    if (!pending) return callbackWhenDone([]);

    candidates.forEach(candidate => {
      const ext = (candidate.split('.').pop() || '').toLowerCase();
      const isImage = ['png','jpg','jpeg','gif','webp','bmp','svg'].includes(ext);
      const isMedia = ['mp4','webm','ogg','mp3','wav','m4a','aac'].includes(ext);

      if (isImage) {
        const img = new Image();
        let finished = false;
        img.onload = () => { if (finished) return; finished = true; successSet.add(candidate); checkDone(); };
        img.onerror = () => { if (finished) return; finished = true; checkDone(); };
        img.src = candidate;
      } else if (isMedia) {
        const v = document.createElement('video');
        let finished = false;
        v.oncanplaythrough = () => { if (finished) return; finished = true; successSet.add(candidate); checkDone(); };
        v.onerror = () => { if (finished) return; finished = true; checkDone(); };
        v.preload = 'metadata';
        v.src = candidate;
        setTimeout(() => { if (finished) return; finished = true; checkDone(); }, 2500);
      } else {
        const img = new Image();
        let finished = false;
        img.onload = () => { if (finished) return; finished = true; successSet.add(candidate); checkDone(); };
        img.onerror = () => { if (finished) return; finished = true; checkDone(); };
        img.src = candidate;
      }
    });

    function checkDone() {
      pending--;
      if (pending <= 0) {
        const ordered = candidates.filter(c => successSet.has(c));
        callbackWhenDone(ordered);
      }
    }
  }

  function buildCandidates(token) {
    const out = [];
    const base = token.trim();
    if (!base) return out;

    const hasPrefix = base.startsWith('http') || base.startsWith('/') || base.startsWith('Img/') || base.startsWith('./') || base.startsWith('../');

    if (/\.[a-zA-Z0-9]{2,4}$/.test(base)) {
      out.push(base);
      if (!hasPrefix) out.push('Img/' + base);
    } else {
      ['.png', '.jpg', '.jpeg', '.mp4', '.webm'].forEach(ext => {
        out.push(base + ext);
        if (!hasPrefix) out.push('Img/' + base + ext);
      });
      out.push(base);
      if (!hasPrefix) out.push('Img/' + base);
    }

    return Array.from(new Set(out));
  }

  function parseImageList(raw) {
    if (!raw) return [];
    return raw.split(/\s*,\s*|\s+/).map(s => s.trim()).filter(Boolean);
  }

  // ---------- Order/select helpers ----------
  function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  function pickFirstPerToken(tokens, loadedCandidates) {
    const out = [];
    tokens.forEach(tok => {
      const cands = buildCandidates(tok);
      const found = cands.find(c => loadedCandidates.includes(c));
      if (found) out.push(found);
    });
    return out;
  }

  function applySelectAndOrder(box, tokens, loadedCandidates) {
    let list = loadedCandidates.slice();
    const select = (box && (box.dataset.popupSelect || box.getAttribute('data-popup-select'))) || 'all'; // 'all' | 'first'
    const order = (box && (box.dataset.popupOrder || box.getAttribute('data-popup-order'))) || 'original'; // 'original' | 'reverse' | 'random'

    if (select === 'first' && tokens && tokens.length) {
      list = pickFirstPerToken(tokens, list);
    }

    if (order === 'reverse') {
      list.reverse();
    } else if (order === 'random' || order === 'shuffle') {
      shuffleArray(list);
    }

    return list;
  }

  // ---------- Per-box sizing helpers ----------
  function createOptionsFromBox(box) {
    if (!box) return {};
    return {
      klass: box.getAttribute('data-popup-class') || box.dataset.popupClass || '',
      size: box.getAttribute('data-popup-size') || box.dataset.popupSize || ''
    };
  }

  function applyExplicitSizeToElement(el, size) {
    if (!size) return;
    if (/^\d+\s*x\s*\d+$/i.test(size)) {
      const [w,h] = size.toLowerCase().split('x').map(s => s.trim());
      el.style.width = w + 'px';
      el.style.height = h + 'px';
    } else {
      el.style.width = size;
      el.style.height = 'auto';
    }
  }

  // ---------- Open popup functions ----------
  function openGalleryWithResolvedImages(srcList, reason, box) {
    const opts = createOptionsFromBox(box);
    scrollBox.innerHTML = '';
    srcList.forEach(src => {
      const i = document.createElement('img');
      i.src = src;
      i.alt = '';
      i.loading = 'lazy';
      i.className = 'popup-image' + (opts.klass ? ' ' + opts.klass : '');
      if (opts.size) applyExplicitSizeToElement(i, opts.size);
      scrollBox.appendChild(i);
    });

    overlay.removeAttribute('hidden');
    document.body.style.overflow = 'hidden';
    requestAnimationFrame(() => {
      console.log('Popup opened —', reason, 'images injected =', scrollBox.querySelectorAll('img').length);
    });
    scrollBox.focus && scrollBox.focus();
  }

  function openGalleryWithVideos(srcList, reason, box) {
    const opts = createOptionsFromBox(box);
    scrollBox.innerHTML = '';
    srcList.forEach(src => {
      const v = document.createElement('video');
      v.src = src;
      v.controls = true;
      v.autoplay = true;
      v.muted = false;
      v.playsInline = true;
      v.loop = false;
      v.preload = 'metadata';
      v.className = 'popup-video' + (opts.klass ? ' ' + opts.klass : '');
      if (opts.size) applyExplicitSizeToElement(v, opts.size);
      v.style.background = 'black';
      scrollBox.appendChild(v);
      v.play().catch(err => {
        console.warn('Popup video play blocked; user may need to press play', err);
      });
    });

    overlay.removeAttribute('hidden');
    document.body.style.overflow = 'hidden';
    requestAnimationFrame(() => {
      console.log('Popup opened (video) —', reason, 'videos =', scrollBox.querySelectorAll('video').length);
    });
    scrollBox.focus && scrollBox.focus();
  }

  function closeGallery() {
    overlay.setAttribute('hidden', '');
    scrollBox.querySelectorAll('video').forEach(v => {
      try { v.pause(); } catch {}
      try { v.src = ''; } catch {}
      try { v.remove(); } catch {}
    });
    scrollBox.querySelectorAll('img').forEach(i => { try { i.remove(); } catch {} });
    scrollBox.innerHTML = '';
    document.body.style.overflow = '';
  }

  // ---------- Preview video hover (muted) ----------
  document.querySelectorAll('.preview-video').forEach(video => {
    const box = video.closest('[class^="flip-box"]');
    if (!box) return;
    box.addEventListener('pointerenter', () => { video.play().catch(()=>{}); }, { passive: true });
    box.addEventListener('pointerleave', () => {
      try { video.pause(); video.currentTime = 0; } catch(e) {}
    }, { passive: true });
    box.addEventListener('focusout', () => {
      try { video.pause(); video.currentTime = 0; } catch(e) {}
    });
  });

  // ---------- Main click handling for flip-box backs ----------
  const boxes = document.querySelectorAll('[class^="flip-box"]');
  boxes.forEach(box => {
    const back = box.querySelector('[class^="flip-back"]');
    if (!back) return;

    back.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();

      // data-popup-video
      const rawVideo = box.getAttribute('data-popup-video') || box.dataset.popupVideo;
      if (rawVideo) {
        const tokens = parseImageList(rawVideo);
        const allCandidates = [];
        tokens.forEach(tok => buildCandidates(tok).forEach(c => allCandidates.push(c)));
        const uniq = Array.from(new Set(allCandidates));
        tryLoadUrls(uniq, (loadedCandidates) => {
          if (loadedCandidates && loadedCandidates.length) {
            const finalList = applySelectAndOrder(box, tokens, loadedCandidates);
            if (finalList && finalList.length) {
              openGalleryWithVideos(finalList, 'data-popup-video', box);
              return;
            }
          }
          fallbackToGroupOrClassOrBack(box, back);
        });
        return;
      }

      // data-popup-image
      const rawAttr = box.getAttribute('data-popup-image') || box.dataset.popupImage;
      if (rawAttr) {
        const tokens = parseImageList(rawAttr);
        const allCandidates = [];
        tokens.forEach(tok => buildCandidates(tok).forEach(c => allCandidates.push(c)));
        const uniq = Array.from(new Set(allCandidates));
        tryLoadUrls(uniq, (loadedCandidates) => {
          if (loadedCandidates && loadedCandidates.length) {
            const finalList = applySelectAndOrder(box, tokens, loadedCandidates);
            if (finalList && finalList.length) {
              openGalleryWithResolvedImages(finalList, 'data-popup-image', box);
              return;
            }
          }
          fallbackToGroupOrClassOrBack(box, back);
        });
        return;
      }

      // data-popup-group
      const group = box.getAttribute('data-popup-group') || box.dataset.popupGroup;
      if (group) {
        const key = group.toLowerCase();
        const list = imageGroups[key] || [];
        if (list.length) {
          const candidates = [];
          list.forEach(tok => buildCandidates(tok).forEach(c=>candidates.push(c)));
          const uniq = Array.from(new Set(candidates));
          tryLoadUrls(uniq, (loaded) => {
            if (loaded && loaded.length) {
              const finalList = applySelectAndOrder(box, list, loaded);
              if (finalList && finalList.length) {
                openGalleryWithResolvedImages(finalList, 'data-popup-group:' + key, box);
                return;
              }
            }
            fallbackToClassOrBack(box, back);
          });
          return;
        }
      }

      // fallback chain
      fallbackToClassOrBack(box, back);
    });
  });

  // ---------- Fallback flows ----------
  function fallbackToGroupOrClassOrBack(box, back) {
    const group = box.getAttribute('data-popup-group') || box.dataset.popupGroup;
    if (group) {
      const key = group.toLowerCase();
      const list = imageGroups[key] || [];
      if (list.length) {
        const candidates = [];
        list.forEach(tok => buildCandidates(tok).forEach(c=>candidates.push(c)));
        const uniq = Array.from(new Set(candidates));
        tryLoadUrls(uniq, (loaded) => {
          if (loaded && loaded.length) {
            const finalList = applySelectAndOrder(box, list, loaded);
            if (finalList && finalList.length) {
              openGalleryWithResolvedImages(finalList, 'data-popup-group:' + key, box);
              return;
            }
          }
          fallbackToClassOrBack(box, back);
        });
        return;
      }
    }
    fallbackToClassOrBack(box, back);
  }

  function fallbackToClassOrBack(box, back) {
    const keys = Object.keys(imageGroups);
    const classList = Array.from(box.classList);
    let foundKey = null;
    for (const cls of classList) if (keys.includes(cls)) { foundKey = cls; break; }
    if (!foundKey) {
      for (const cls of classList) if (keys.includes(cls.toLowerCase())) { foundKey = cls.toLowerCase(); break; }
    }
    if (foundKey) {
      const list = imageGroups[foundKey] || [];
      const candidates = [];
      list.forEach(tok => buildCandidates(tok).forEach(c=>candidates.push(c)));
      const uniq = Array.from(new Set(candidates));
      tryLoadUrls(uniq, (loaded) => {
        if (loaded && loaded.length) {
          const finalList = applySelectAndOrder(box, list, loaded);
          if (finalList && finalList.length) {
            openGalleryWithResolvedImages(finalList, 'class-key:' + foundKey, box);
            return;
          }
        }
        finalBackFallback(back);
      });
      return;
    }
    finalBackFallback(back);
  }

  function finalBackFallback(back) {
    const single = back.querySelector('img, video');
    const box = back.closest('[class^="flip-box"]');
    if (single && single.src) {
      if (single.tagName && single.tagName.toLowerCase() === 'video') {
        openGalleryWithVideos([single.src], 'fallback back-side video', box);
      } else {
        openGalleryWithResolvedImages([single.src], 'fallback back-side image', box);
      }
    } else {
      console.warn('Popup: no images or videos found for flip-box and no back-side media');
    }
  }

  // ---------- Popup scroll/touch tweaks and close handlers ----------
  scrollBox.addEventListener('wheel', function(e) {
    const delta = e.deltaY;
    const atTop = scrollBox.scrollTop === 0;
    const atBottom = Math.abs(scrollBox.scrollHeight - scrollBox.clientHeight - scrollBox.scrollTop) < 1;
    if ((delta < 0 && atTop) || (delta > 0 && atBottom)) { e.preventDefault(); }
    e.stopPropagation();
  }, { passive: false });

  scrollBox.addEventListener('touchstart', (e) => { scrollBox._startY = e.touches ? e.touches[0].clientY : 0; }, { passive: true });
  scrollBox.addEventListener('touchmove', (e) => {
    const currentY = e.touches ? e.touches[0].clientY : 0;
    const dy = (scrollBox._startY || 0) - currentY;
    const atTop = scrollBox.scrollTop === 0;
    const atBottom = Math.abs(scrollBox.scrollHeight - scrollBox.clientHeight - scrollBox.scrollTop) < 1;
    if ((dy < 0 && atTop) || (dy > 0 && atBottom)) { e.preventDefault(); }
  }, { passive: false });

  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeGallery(); });
  closeBtn.addEventListener('click', closeGallery);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeGallery(); });

});
