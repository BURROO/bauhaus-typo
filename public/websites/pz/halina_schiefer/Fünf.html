<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Fünf.css">
    <link rel="icon" type="image/x-icon" href="Img/favicon.ico">
    <title>Circle Path Animation</title>
    
</head>
<body>

    <div class="animation-container">
        <svg id="pathSvg"></svg>
        
        
        <div class="moving-circle" id="movingCircle"></div>
        

        <div class="controls">
            <button id="playBtn" onclick="playAnimation()">Play</button>
            <button id="pauseBtn" onclick="pauseAnimation()" disabled>Pause</button>
            <button id="resetBtn" onclick="resetAnimation()">Reset</button>
        </div>

        <div class="duration-control">
            <label for="durationInput">Duration (sec):</label>
            <input type="number" id="durationInput" value="10" min="1" max="120" step="0.5" onchange="updateDuration()">
        </div>
    </div>

    <script>
        class CirclePathAnimation {
            constructor(pathElement, circleId, duration = 10000) {
                this.path = pathElement;
                this. circle = document.getElementById(circleId);
                this.duration = duration;
                this.startTime = null;
                this.isAnimating = false;
                this. isPaused = false;
                this.pausedTime = 0;
                this.animationFrameId = null;
            }

            play() {
                if (this. isAnimating && !this.isPaused) return;

                this.isPaused = false;
                this.isAnimating = true;

                if (this.startTime === null) {
                    this.startTime = Date.now() - this.pausedTime;
                } else if (this.pausedTime > 0) {
                    this.startTime = Date.now() - this.pausedTime;
                }

                this.animate();
                this.updateButtonStates();
            }

            pause() {
                if (! this.isAnimating || this.isPaused) return;

                this.isPaused = true;
                this.pausedTime = Date.now() - this.startTime;
                cancelAnimationFrame(this.animationFrameId);
                this. updateButtonStates();
            }

            reset() {
                cancelAnimationFrame(this.animationFrameId);
                this. startTime = null;
                this. pausedTime = 0;
                this.isAnimating = false;
                this.isPaused = false;

                const pathLength = this.path.getTotalLength();
                const point = this.path.getPointAtLength(0);
                this.circle.style.left = (point.x - 15) + 'px';
                this.circle.style. top = (point.y - 15) + 'px';

                this.updateButtonStates();
            }

            animate() {
                const now = Date.now();
                const elapsed = now - this.startTime;
                const progress = Math.min(elapsed / this.duration, 1);

                if (progress < 1) {
                    const pathLength = this.path.getTotalLength();
                    const distance = pathLength * progress;
                    const point = this.path. getPointAtLength(distance);

                    this.circle.style. left = (point.x - 15) + 'px';
                    this.circle.style. top = (point.y - 15) + 'px';

                    this.animationFrameId = requestAnimationFrame(() => this.animate());
                } else {
                    this.isAnimating = false;
                    this.isPaused = false;
                    this.startTime = null;
                    this.pausedTime = 0;
                    this.updateButtonStates();
                }
            }

            updateButtonStates() {
                const playBtn = document.getElementById('playBtn');
                const pauseBtn = document.getElementById('pauseBtn');

                if (this.isAnimating && !this.isPaused) {
                    playBtn.disabled = true;
                    pauseBtn.disabled = false;
                } else {
                    playBtn. disabled = false;
                    pauseBtn.disabled = true;
                }
            }

            setDuration(newDuration) {
                this. duration = newDuration;
            }
        }

        let animation = null;

        async function loadSVG() {
            try {
                const response = await fetch('./Maschine.svg');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const svgText = await response.text();
                const svgContainer = document.getElementById('pathSvg');
                svgContainer.innerHTML = svgText;

                const pathElement = svgContainer.querySelector('path');
                if (!pathElement) {
                    console.error('No path element found in SVG file');
                    return;
                }

                animation = new CirclePathAnimation(pathElement, 'movingCircle', 10000);
                animation.reset();
                console.log('SVG loaded successfully');
            } catch (error) {
                console. error('Error loading SVG file:', error);
                alert('Error loading SVG file.  Make sure Maschine.svg is in the same folder as index.html');
            }
        }

        function playAnimation() {
            if (animation) animation.play();
        }

        function pauseAnimation() {
            if (animation) animation.pause();
        }

        function resetAnimation() {
            if (animation) animation.reset();
        }

        function updateDuration() {
            const input = document.getElementById('durationInput');
            const seconds = parseFloat(input.value);
            if (animation && seconds > 0) {
                animation.setDuration(seconds * 1000);
                console.log(`Duration updated to ${seconds} seconds`);
            }
        }

        window.addEventListener('DOMContentLoaded', loadSVG);
    </script>

    <a href="Sechs.html">
        <p>
            exit
        </p>
    </a>

    <div>
            <a href="Eins.html">
                <img src="Video/Bulblight.gif">
            </a>
        </div>
</body>
</html>
