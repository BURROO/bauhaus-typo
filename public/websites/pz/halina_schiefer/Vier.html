<!-- Popup container -->
<div id="popupOverlay" class="popup-overlay" hidden>
  <div class="popup-content">
    <button id="popupClose" class="popup-close" aria-label="Popup schließen">
      &times;
    </button>

    <div id="popupScroll" class="popup-scroll">

      <!-- Bilder werden hier per JS eingefügt -->
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {

    // du erstellst für jede Bildgruppe die Gruppe als Konstante „Wenn jemand oma anklickt → zeige diese Bilder“ natürlich ergänzen für alle
  const imageGroups = {
    oma: [
      'Img/NachrichtOma.png',
      'Img/Thanxx.png',
      'Schmetterlinge1.png'
    ],

    sowichtig:[
     'Img/Beingloved.png',
     'Img/Gebuloveganz.jpg',


    ],

  };

//   html element holen damit js sie benutzen kann
  const triggers = document.querySelectorAll('[data-popup-group]');
  const overlay = document.getElementById('popupOverlay');
  const scrollBox = document.getElementById('popupScroll');
  const closeBtn = document.getElementById('popupClose');

//   close funktion
  const close = () => {
    overlay.setAttribute('hidden', ''); //popup wird unsichtbar
    scrollBox.innerHTML = ''; //alle bilder im popup werden temporär gelöscht
    document.body.style.overflow = ''; //nicht mehr scrollen
  };

  triggers.forEach(el => { //jeder Umschlag einzeln ...
    el.addEventListener('click', e => { //...hört auf einen click
      e.preventDefault();

      const groupName = el.dataset.popupGroup; //welche bilder sollen gezeigt werden
      const images = imageGroups[groupName]; //hol die bilder
      if (!images) return; //sicherheitsmaßnahme falls es keine bilder gibt soll die seite trotzdem nicht kaputtgehen

      scrollBox.innerHTML = ''; //alte bilder löschen, falls man schon mal was angeclickt hat

      images.forEach(src => { //für jeded bild der gruppe
        const img = document.createElement('img'); //erzeuge ein img element
        img.src = src; //stez den bildpfad
        img.alt = '';
        scrollBox.appendChild(img); // und ins popup div
      });

      overlay.removeAttribute('hidden'); //popup wird sichtbar
      document.body.style.overflow = 'hidden'; //hintergrund darf nicht scrollen
    });
  });

  overlay.addEventListener('click', e => {
    if (e.target === overlay) close();
  }); //wenn man auf den hintergrund clickt schließen

  closeBtn.addEventListener('click', close); //click auf x -> schließen

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') close();
  }); //press auf esc dann schließt sich das auch

});
</script>
