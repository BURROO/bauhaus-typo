<html>

        <meta charset="utf-8">

<body class="poem-body">

<div class="Poem">

        <img src="Img/Sterne1.png" id="Sterne1">
        <img src="Img/Sterne2.png" id="Sterne2">

<!-- Ich glaube das problem ist hier bei dem Popover Approach -->
        <button class="line" id="Line1">meine liebste</button>
        <button class="line" id="Line2">dies ist mein abschiedsbrief an dich</button>
        <button class="line " id="Line3">auch wenn ich ihn vermutlich niemals abschicken werde</button>
        <button class="line" id="Line4">es tut weh das zu schreiben</button>
        <!-- <button class="line img" id="Line5"><img src="Img/naja.png" alt="" height="100%"></button> -->
        <button class="line" id="Line6">du bist ein wirbelsturm in meinem kopf</button>
        <button class="line" id="Line7">aber vor der realität zu fliehen tut noch mehr weh zumindest mir</button>
        <button class="line" id="Line5b">auch diese erkenntnis tut mir weh</button>
        <button class="line" id="Line8">ich hab dich so geliebt</button>
        <button class="line" id="Line9">ich liebe dich immer noch</button>
        <button class="line" id="Line10">mit dir konnte ich träumen</button>
        <button class="line" id="Line11">wir hatten so viel spaß miteinander und ich konnte einfach ich sein</button>
        <button class="line" id="Line12">mit dir</button>
        <button class="line" id="Line13">aber jetzt hast du mich allein gelassen</button>
        <button class="line" id="Line14">in dieser welt, die sich einfach dreht und dreht und dreht</button>
        <button class="line" id="Line15">was soll ich nur tun</button>
        <button class="line" id="Line16">schließlich kann ich sie nicht aufhalten</button>
        <button class="line" id="Line17">aber veränderung ist schwer</button>
        <button class="line" id="Line18">die erde hat ihre drehrichutng geändert</button>
        <button class="line" id="Line19">die blauen krallen der nacht</button>
        <button class="line" id="Line20">haben sich an mir festgebissen</button>
        <button class="line" id="Line21">was soll ich mit zuckerwatte, wenn niemand sie mit mir isst</button>
        <button class="line" id="Line22">sie verdeckt nur die sonne</button>
        <button class="line" id="Line23">dann scheint sie nicht mehr</button>
        <button class="line" id="Line24">tut sie ja sowieso nicht</button>
        <button class="line" id="Line25">diese seltsame verschiebung hat schon seit langer zeit</button>
        <button class="line" id="Line26">begonnen</button>
        <button class="line" id="Line27">irgendwann ist einfach alles dunkel geworden</button>
        <button class="line" id="Line28">vermutlich haben wir uns beide einfach zu sehr auseinander entwickelt</button>
        <button class="line" id="Line29">ist ja gar nicht deine schuld</button>
        <button class="line" id="Line30">bitte können wir den kontakt beenden</button>
        <button class="line" id="Line31">warum erzählst du mir nichts mehr</button>
        <button class="line" id="Line32">ich dachte wir hätten keine geheimnisse</button>
        <button class="line" id="Line33">ich dachte du lässt mich nicht im stich</button>
        <button class="line" id="Line34">aber jetzt ist es geschehen</button>
        <button class="line" id="Line35">ich kann dir wohl kaum einen vorwurf machen</button>
        <button class="line" id="Line36">seit ich dich nicht mehr habe, habe ich Flugangst</button>
        <button class="line" id="Line37">der gedanke an die dröhnende maschine macht mich wahnsinnig</button>
        <button class="line" id="Line38">ich kann den boden unter den füßen nicht verlieren</button>
        <button class="line" id="Line39">aber er rutscht weg</button>
        <button class="line" id="Line40">ich kann den boden unter den füßen nicht verlieren</button>
        <button class="line" id="Line41">dafür dreht sich die erde zu schnell</button>
        <button class="line" id="Line42">ich glaube wir sollten mal reden</button>
        <button class="line" id="Line43">mögen wir uns</button>
        <button class="line" id="Line44">oder verbringen wir einfach nur zeit miteinander</button>
        <button class="line" id="Line45">die tage sind so lang und gehen doch so schnell vorüber</button>
        <button class="line" id="Line46">ich habe solche angst dass du weg bist</button>
        <button class="line" id="Line47">weil jemand besseres kommt</button>
        <button class="line" id="Line48">so als ersatzteil lebt es sich nicht so lang</button>
        <button class="line" id="Line49">ersatzteile sind austauschbar</button>
        <button class="line" id="Line50">oft kann man sie billiger als das original ersteigern</button>
        <button class="line" id="Line51">ich gebe auch ungern mehr geld als nötig dafür aus</button>
        <button class="line" id="Line52">eigentlich kaufe ich gar keine ersatzteile</button>
        <button class="line" id="Line53">man baut sie ja doch nie ein</button>
        <button class="line" id="Line54">und dann verstauben sie in einer ecke</button>
        <button class="line" id="Line55">und staubwischen tue ich auch nie</button>
        <button class="line" id="Line56">ich vermisse dich, dabei habe ich gar keinen grund dazu</button>
        <button class="line" id="Line57">du wohnst ja nur um die ecke</button>
        <button class="line" id="Line58">ich kann schon fast in dein fenster schauen von meinem balkon aus</button>
        <button class="line" id="Line59">auf dem stehen immer noch die bruchstücke des sommers</button>
        <button class="line" id="Line60">in meinen lungen verbrennt der sauerstoff</button>
        <button class="line" id="Line61">dann habe ich angst zu ersticken</button>
        <button class="line" id="Line62">deswegen muss das fenster immer offen bleiben</button>
        <button class="line" id="Line63">du hättest mir ja mal antworten können</button>
        <button class="line" id="Line64">oft schlafe ich nicht ein</button>
        <button class="line" id="Line65">vielleicht füllt sich mein körper mit staub</button>
        <button class="line" id="Line66">trocken und schmutzig</button>
        <button class="line" id="Line67">dann kann ich ersticken</button>
        <button class="line" id="Line68">auch mit offenem fenster</button>

        <button class="line" id="Line68a">du bist ein wirbelsturm in meiner brust</button>
        <button class="line" id="Line68b">jedes staubkorn pustest du umher</button>
        <button class="line" id="Line68c">ich versuche dich aufzuhalten</button>
        <button class="line" id="Line68d">aber das geht nicht</button>
        <button class="line" id="Line68e">viel zu schnell bist du</button>
        <button class="line" id="Line68f">wir können es nicht wegputzen</button>
        <button class="line" id="Line68g">das ist mir auch einfach viel zu laut</button>
        <button class="line" id="Line68h">so ein verdammtes getöse</button>
        <button class="line" id="Line68i">ich kann gar nicht mehr hören was die anderen sagen</button>
        <button class="line" id="Line68j">es ist so laut dass ich meine gedanken nicht höre</button>
        <button class="line" id="Line68k">immerhin bist du in mir drin</button>
        <button class="line" id="Line68l">und kannst nicht weg</button>
        <button class="line" id="Line68m">ich habe dich eingefangen</button>
        <button class="line" id="Line68n">gefangen genommen</button>
        <button class="line" id="Line68o">sind meine rippen die gitterstäbe</button>
        <button class="line" id="Line68p">wie gerne ich dich festhalte</button>
        <button class="line" id="Line68q">aber ich denke du solltest jetzt gehen</button>
        <button class="line" id="Line68r">aber du kommst nicht raus</button>
        <button class="line" id="Line68s">ich habe den schlüssel verloren</button>
        <button class="line" id="Line68t">und jetzt?</button>
        <button class="line" id="Line68u">ich weiß doch auch nicht.</button> 
        
        <button class="line" id="Line69">warum hast du mir immer noch nicht geantwortet</button>
        <button class="line" id="Line70">wenn ich weiß du bist bei jemand anderem bin ich eifersüchtig</button>
        <button class="line" id="Line71">das will ich nicht</button>
        <button class="line" id="Line72">eigentlich will ich einfach nur nach hause</button>
        <button class="line" id="Line73">oder zu dir</button>
        <button class="line" id="Line74">besser wäre nach hause</button>
        <button class="line" id="Line75">aber ich muss bei dir bleiben</button>

</div>



<script>


  const lines = document.querySelectorAll('.line');

  // erste Zeile sichtbar machen
  lines[0].classList.add('visible');

  lines.forEach((line, index) => {
    line.addEventListener('click', () => {
      const next = lines[index + 1];
      if (next) {
        next.classList.add('visible');
      }
    });
  });

</script>
