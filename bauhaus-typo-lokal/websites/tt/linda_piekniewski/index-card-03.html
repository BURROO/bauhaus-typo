<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playground 03</title>
    <link rel="stylesheet" href="styles.index-card-03.css">
</head>

<body>   
    <!-- Hidden color picker input -->
    <input type="color" id="color-picker" value="#FF0000" hidden/>

    <!-- Font Selection Dropdown -->
    <div class="font-modal" id="font-modal">
        <div class="font-modal-content">
            <h2>Select Font</h2>
            <div class="font-options">
                <button class="font-option" data-font="ABCFavorit-Regular">Favorit</button>
                <button class="font-option" data-font="Arial">Arial</button>
                <button class="font-option" data-font="Helvetica">Helvetica</button>
            </div>
            <button class="close-modal">Cancel</button>
        </div>
    </div>

    <!-- Header -->
    <header class="header">

        <button class="ui-button" id="load-button">Load
            <span class="tooltip">Choose your font</span>
        </button>

        <button class="ui-button" id="write-button">Write
            <span class="tooltip">Try your font</span>
        </button>

        <button class="ui-button">Export
            <span class="tooltip">Export as SVG</span>
        </button>

    </header>

    <!-- Side Controls -->
    <div class="side-controls">

        <button class="ui-button" id="add-button">Add
            <span class="tooltip">Add more elements</span>
        </button>

        <button class="ui-button" id="delete-button">Delete
            <span class="tooltip">Delete selected elements</span>
        </button>

    </div>

    <!-- Main Content -->
    <div class="interface-wrapper">
        <div class="card card-3">
            <svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" viewBox="0 0 1440 1024" fill="none">
            <path d="M1440 1009V75C1440 66.7157 1433.28 60 1425 60H475C466.716 60 460 53.2843 460 45V15C460 6.7157 453.284 0 445 0H15C6.7157 0 0 6.7157 0 15V1009C0 1017.28 6.7157 1024 15 1024H1425C1433.28 1024 1440 1017.28 1440 1009Z" fill="#0000FF"/>
            </svg>
            <div class="card-title">Playground 03</div>
            <div class="card-description">
                <button class="close-description">×</button>
                Draw. This field focuses on individual initials and numbers. Once the game starts, you can use the ‘Add’ button to draw, edit, and move text fields. Feel free to edit and move them. Use ‘+’ and ‘–’ to enlarge and shrink the displayed area. 36pt is 100%.
            </div>

            <!-- Canvas for brush rendering -->
            <canvas id="brush-canvas"></canvas>

            <!-- Layer for DOM-based letter boxes (positioned over the canvas) -->
            <div class="letter-layer"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer-buttons">
        <button class="Help-Button" id="help-button">
            <!-- Normal mode SVG -->
             <svg class="bg-5 help-normal" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" viewBox="0 0 60 60" fill="none">
                <path d="M15 1H45C52.732 1 59 7.26801 59 15V45C59 52.732 52.732 59 45 59H15C7.26801 59 1 52.732 1 45V15C1 7.26801 7.26801 1 15 1Z" stroke="white" stroke-width="2"/>
            </svg>
            
            <!-- Outline mode SVG -->
             <svg class="bg-5 help-outline" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" viewBox="0 0 60 60" fill="none" style="display: none;">
                <path d="M15 1H45C52.732 1 59 7.26801 59 15V45C59 52.732 52.732 59 45 59H15C7.26801 59 1 52.732 1 45V15C1 7.26801 7.26801 1 15 1Z" stroke="white" stroke-width="2"/>
            </svg>
            <span class="help-glyph">?</span>
            <span class="tooltip">Help</span>
        </button>

        <button class="Invert-Button" id="invert-button">
            <!-- Normal mode SVG -->
            <svg class="bg-1 invert-normal" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" viewBox="0 0 60 60" fill="none">
                <path d="M45 0H15C6.7 0 0 6.7 0 15V45C0 53.3 6.7 60 15 60H45C53.3 60 60 53.3 60 45V15C60 6.7 53.3 0 45 0ZM15 58C11.4 58 8.2 56.5 5.8 54.2L12.2 47.8L22.4 58H14.9H15ZM25.3 58L13.7 46.4L20.8 39.3L39.6 58.1H25.4L25.3 58ZM45 58H42.4L22.2 37.8L29.3 30.7L53.5 54.9C51.2 56.9 48.3 58 45 58ZM58 45C58 48.2 56.8 51.2 54.9 53.5L30.7 29.3L37.8 22.2L58 42.4V45.1V45ZM58 39.5L39.2 20.7L46.3 13.6L57.9 25.2V39.4L58 39.5ZM58 22.4L47.8 12.2L54.2 5.8C56.5 8.2 58 11.4 58 15V22.4Z" fill="white"/>
            </svg>

            <!-- Outline mode SVG (hidden by default) -->
            <svg class="bg-1 invert-outline" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" viewBox="0 0 60 60" fill="none" style="display: none;">
                <path d="M45 0H15C6.7 0 0 6.7 0 15V45C0 53.3 6.7 60 15 60H45C53.3 60 60 53.3 60 45V15C60 6.7 53.3 0 45 0ZM58 14.9V22.4L48.5 12.9L54.9 6.5C56.8 8.8 58 11.7 58 14.9ZM58 25.3V39.5L40 21.5L47.1 14.4L58 25.3ZM2 44.9V15C2 7.8 7.8 2 15 2H45C48.2 2 51.2 3.2 53.5 5.1L5.1 53.4C3.1 51.1 2 48.2 2 44.9ZM15.1 58C11.9 58 8.9 56.8 6.7 54.9H6.6L13 48.5L22.5 58H15.1ZM25.3 57.9L14.4 47L21.5 39.9L39.5 57.9H25.3ZM44.9 57.9H42.2L22.8 38.5L29.9 31.4L53.3 54.8C51 56.8 48.1 57.9 44.9 57.9ZM58.1 45.1C58.1 48.3 56.9 51.3 55 53.5L31.5 30L38.6 22.9L58.1 42.4V45.1Z" fill="var(--base-color)"/>
            </svg>
            <span class="tooltip">Invert</span>
        </button>

        <button class="Outline-Button" id="outline-button">
            <!-- Normal mode SVG -->
            <svg class="bg-2 outline-normal" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" viewBox="0 0 60 60" fill="none">
                <path d="M15 1H45C52.732 1 59 7.26801 59 15V45C59 52.732 52.732 59 45 59H15C7.26801 59 1 52.732 1 45V15C1 7.26801 7.26801 1 15 1Z" stroke="white" stroke-width="2"/>
            </svg>

            <!-- Outline mode SVG -->
            <svg class="bg-2 outline-outline" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" viewBox="0 0 60 60" fill="none" style="display: none;">
                <path d="M45 0H15C6.71573 0 0 6.71573 0 15V45C0 53.2843 6.71573 60 15 60H45C53.2843 60 60 53.2843 60 45V15C60 6.71573 53.2843 0 45 0Z" fill="var(--base-color)"/>
            </svg>
            <span class="tooltip">Outline</span>
        </button>

        <button class="Colorwheel-Button" id="Colorwheel-Button">
            <!-- Normal mode SVG -->
            <svg class="bg-3 colorwheel-normal" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" viewBox="0 0 60 60" fill="none">
                <path d="M15 1H45C52.732 1 59 7.26801 59 15V45C59 52.732 52.732 59 45 59H15C7.26802 59 1 52.732 1 45V15C1 7.38882 7.07368 1.19653 14.6387 1.00488L15 1Z" fill="url(#paint0_linear_4701_50)" stroke="white" stroke-width="2"/>
                <defs>
                    <linearGradient id="paint0_linear_4701_50" x1="0.0300279" y1="1.43016e-06" x2="60.03" y2="60" gradientUnits="userSpaceOnUse">
                        <stop offset="0.1" stop-color="white"/>
                        <stop offset="0.9" stop-color="var(--base-color)"/>
                    </linearGradient>
                </defs>
            </svg>

            <!-- Outline mode SVG (hidden by default) -->
            <svg class="bg-3 colorwheel-outline" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" viewBox="0 0 60 60" fill="none" style="display: none;">
                <path d="M45 0H15C6.7 0 0 6.7 0 15V45C0 53.3 6.7 60 15 60H45C53.3 60 60 53.3 60 45V15C60 6.7 53.3 0 45 0ZM58 38.8L38.8 58H30.7L58 30.7V38.8ZM50.1 3L3 50.1C2.3 48.5 2 46.8 2 45V43.1L43.1 2H45C46.8 2 48.5 2.4 50.1 3ZM2 21.2L21.2 2H29.3L2 29.3V21.2ZM2 32.1L32.1 2H40.2L2 40.2V32.1ZM15 2H18.4L2 18.4V15C2 7.8 7.8 2 15 2ZM4 51.9L51.9 4C53.5 5 54.9 6.4 55.9 8L8.1 56C6.5 55 5.1 53.6 4.1 52L4 51.9ZM15 58C13.2 58 11.5 57.6 9.9 57L57 9.9C57.7 11.5 58 13.2 58 15V16.9L16.9 58H15ZM58 19.8V27.9L27.9 58H19.8L58 19.8ZM45 58H41.6L58 41.6V45C58 52.2 52.2 58 45 58Z" fill="var(--base-color)"/>
            </svg>

            <!-- Invert mode SVG (hidden by default) -->
            <svg class="bg-3 colorwheel-invert" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" viewBox="0 0 60 60" fill="none" style="display: none;">
                <path d="M15 1H45C52.732 1 59 7.26801 59 15V45C59 52.732 52.732 59 45 59H15C7.26802 59 1 52.732 1 45V15C1 7.38882 7.07368 1.19653 14.6387 1.00488L15 1Z" fill="url(#paint0_linear_4733_191)" stroke="var(--base-color)" stroke-width="2"/>
                <defs>
                    <linearGradient id="paint0_linear_4733_191" x1="0.0300279" y1="1.43016e-06" x2="60.03" y2="60" gradientUnits="userSpaceOnUse">
                        <stop offset="0.1" stop-color="white"/>
                        <stop offset="0.9" stop-color="var(--base-color)"/>
                    </linearGradient>
                </defs>
            </svg>
            <span class="tooltip">Colorwheel</span>
        </button>

        <button class="Home-Button" onclick="window.location.href='index.html'">
            <!-- Normal mode SVG -->
            <svg class="bg-4 home-normal" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" viewBox="0 0 60 60" fill="none">
                <path d="M45 2C52.1682 2 58 7.8315 58 15V45C58 52.1685 52.1682 58 45 58H15C7.8318 58 2 52.1685 2 45V15C2 7.8315 7.8318 2 15 2H45ZM45 0H15C6.7157 0 0 6.7153 0 15V45C0 53.2842 6.7157 60 15 60H45C53.2842 60 60 53.2842 60 45V15C60 6.7153 53.2842 0 45 0Z" fill="white"/>
                <path d="M44.9971 29.9983V44.9983H33.7471V37.4983H26.2471V44.9983H14.9971V29.9983L29.9971 14.9983L44.9971 29.9983Z" fill="white"/>
            </svg>
            
            <!-- Outline mode SVG (hidden by default) -->
            <svg class="bg-4 home-outline" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" viewBox="0 0 60 60" fill="none" style="display: none;">
                <path d="M45 2C52.2 2 58 7.8 58 15V45C58 52.2 52.2 58 45 58H15C7.8 58 2 52.2 2 45V15C2 7.8 7.8 2 15 2H45ZM45 0H15C6.7 0 0 6.7 0 15V45C0 53.3 6.7 60 15 60H45C53.3 60 60 53.3 60 45V15C60 6.7 53.3 0 45 0Z" fill="#FF0000"/>
                <path d="M45.9996 46.0001H32.7996V38.5001H27.2996V46.0001H14.0996V29.6001L29.9996 13.6001L45.9996 29.6001V46.0001ZM34.6996 44.0001H43.8996V30.4001L29.8996 16.4001L15.8996 30.4001V44.0001H25.0996V36.5001H34.5996V44.0001H34.6996Z" fill="#FF0000"/>
            </svg>
            <span class="tooltip">Home</span>
        </button>
    </footer>

    <script src="index-card-03.js"></script>
</body>
</html>
